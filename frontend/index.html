<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Coach Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/chess.css" />
</head>
<body>
<div id="app">

  <!-- ── Top bar ─────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">♟</span>
      <span class="brand-name">Chess Coach</span>
    </div>
    <nav class="topbar-nav">
      <a href="/" class="nav-link active">Coaching</a>
      <a href="/practice" class="nav-link">Practice</a>
      <a href="/play" class="nav-link">Play</a>
      <a href="/reports" class="nav-link">Reports</a>
    </nav>
    <div class="topbar-status">
      <span id="status-text">Ready</span>
      <div id="status-dot"></div>
    </div>
  </header>

  <!-- ── Agent pipeline ─────────────────────────────────────── -->
  <div id="pipeline">
    <div class="agent-node analyst" id="node-analyst">
      <div class="face" id="sprite-analyst"></div>
      <div class="label">Analyst</div>
      <div class="status-badge" id="badge-analyst">—</div>
    </div>

    <div class="pipe-arrow" id="arrow-analyst-engine">
      <div class="arrow-line"></div>
      <div class="arrow-head">▶</div>
    </div>

    <div class="agent-node engine" id="node-engine">
      <div class="face" id="sprite-engine"></div>
      <div class="label">Engine</div>
      <div class="status-badge" id="badge-engine">—</div>
    </div>

    <div class="pipe-arrow" id="arrow-engine-coach">
      <div class="arrow-line"></div>
      <div class="arrow-head">▶</div>
    </div>

    <div class="agent-node coach" id="node-coach">
      <div class="face" id="sprite-coach"></div>
      <div class="label">Coach King</div>
      <div class="status-badge" id="badge-coach">—</div>
    </div>

    <div class="pipe-arrow" id="arrow-coach-critic">
      <div class="arrow-line"></div>
      <div class="arrow-head">▶</div>
    </div>

    <div class="agent-node critic" id="node-critic">
      <div class="face" id="sprite-critic"></div>
      <div class="label">Critic</div>
      <div class="status-badge" id="badge-critic">—</div>
    </div>

    <div class="feedback-label" id="feedback-label">↺ revising...</div>
  </div>

  <!-- ── Content area ───────────────────────────────────────── -->
  <div id="content">

    <!-- Left: live output -->
    <div class="panel" id="output-panel">
      <div class="panel-header">Live Output</div>
      <div id="output-body"></div>
    </div>

    <!-- Right: session controls on top, debug below -->
    <div id="right-panel">

      <!-- Session setup / question / complete -->
      <div class="panel" id="interaction-panel">
        <div class="panel-header" id="interaction-header">Session Setup</div>
        <div id="interaction-body">

          <form id="setup-form" onsubmit="startSession(event)">
            <div class="form-row">
              <label>Chess.com Username</label>
              <input type="text" id="input-username" placeholder="e.g. JagerBombEnjoyer" required />
            </div>
            <div class="form-row-inline">
              <div class="form-row">
                <label>Games</label>
                <input type="number" id="input-games" value="10" min="1" max="50" />
              </div>
              <div class="form-row">
                <label>Time Control</label>
                <select id="input-tc">
                  <option value="all">All</option>
                  <option value="blitz" selected>Blitz</option>
                  <option value="bullet">Bullet</option>
                  <option value="rapid">Rapid</option>
                  <option value="daily">Daily</option>
                </select>
              </div>
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="input-engine" />
              <span>
                <strong>Deep engine analysis</strong> — builds a personalized
                Key Positions workbook from your blunders (adds 3–5 min).
              </span>
            </label>
            <button type="submit" class="btn btn-primary btn-full" id="start-btn">
              Analyze My Games
            </button>
          </form>

          <div id="question-card">
            <div class="coach-question-header">
              <span class="crown">♟</span>
              <span>Coach King</span>
            </div>
            <div id="question-text"></div>
            <div id="question-options"></div>
            <textarea id="answer-input" placeholder="Type your answer — or leave blank to keep your saved response"></textarea>
            <button class="btn btn-primary btn-full" onclick="submitAnswer()">Submit Answer</button>
          </div>

          <div id="complete-card">
            <div class="complete-msg">✓ Your coaching workbook is ready!</div>
            <button class="btn btn-primary btn-full" onclick="downloadPdf()">Download Workbook</button>
            <button class="btn btn-secondary btn-full" onclick="resetSession()">Start New Session</button>
          </div>

        </div>
      </div>

      <!-- Debug log -->
      <div class="panel" id="debug-panel">
        <div class="panel-header">Debug Log</div>
        <div id="debug-body"></div>
      </div>

    </div>
  </div>

</div>
<script src="/static/sprites.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
